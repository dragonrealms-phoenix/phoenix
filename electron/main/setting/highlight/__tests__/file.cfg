Lines that don not start with #highlight are ignored

#highlight {line} {fg0} {pattern 0} {class 0}
#highlight {lines} {fg1,bg1} {pattern 1} {class 1}

#highlight {beginswith} {fg2} {pattern 2} {class 2}
#highlight {startswith} {fg3,bg3} {pattern 3} {class 3}

#highlight {regex} {fg4} {pattern 4} {class 4}
#highlight {regexp} {fg5, bg5} {pattern 5} {class 5}

#highlight {string} {fg6} {pattern 6} {class 6}
#highlight {strings} {fg7, bg7} {pattern 7} {class 7}
